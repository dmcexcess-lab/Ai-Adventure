name: Validate Godot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: "stable"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-editor-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Install Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .tools/godot
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .tools/godot
          chmod +x ".tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"

      - name: Engine version
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --version

      - name: Import texture assets
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --import

      - name: Resource smoke test
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --script tests/smoke.gd

      - name: Interaction smoke test
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --script tests/interaction_smoke.gd

      - name: Evidence smoke test
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --script tests/evidence_smoke.gd

      - name: Deduction smoke test
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --script tests/deduction_smoke.gd

      - name: Dialogue smoke test
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --script tests/dialogue_smoke.gd

      - name: RPG smoke test
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --script tests/rpg_smoke.gd

      - name: UI demo smoke test
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --script tests/ui_demo_smoke.gd

      - name: Persistence smoke test
        run: .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --script tests/persistence_smoke.gd

      - name: Main scene startup
        run: timeout 30s .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --path . --quit-after 3

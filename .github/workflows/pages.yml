name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: "stable"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot web toolchain
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-web-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Install Godot editor and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .tools/godot
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .tools/godot
          chmod +x ".tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"

          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" \
            -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Export Web build
        shell: bash
        run: |
          mkdir -p build/web
          .tools/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 \
            --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Verify packaged runtime art
        shell: bash
        run: |
          test -s build/web/index.pck
          grep -a -q "community_center_lobby_production.png" build/web/index.pck
          grep -a -q "exterior_entry_production.png" build/web/index.pck
          grep -a -q "front_desk_production.png" build/web/index.pck
          grep -a -q "lost_found_hall_production.png" build/web/index.pck
          grep -a -q "staff_office_production.png" build/web/index.pck
          grep -a -q "storage_room_production.png" build/web/index.pck
          grep -a -q "maintenance_corridor_production.png" build/web/index.pck
          grep -a -q "loading_bay_production.png" build/web/index.pck
          grep -a -q "pc3_reference_atlas.webp" build/web/index.pck
          grep -a -q "alex_sprite_noir.svg" build/web/index.pck
          grep -a -q "alex_portrait_noir.svg" build/web/index.pck
          grep -a -q "mina_portrait_noir.svg" build/web/index.pck
          grep -a -q "mina_sprite_noir.svg" build/web/index.pck
          grep -a -q "combat_intruder_noir.svg" build/web/index.pck

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
